name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install lightweight deps (models are stubbed in tests)
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 fastapi ffmpeg-python python-magic soundfile
    - name: Lint (syntax errors and undefined names fail the build)
      working-directory: src
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Unit tests
      working-directory: src
      run: pytest -q
